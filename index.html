<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Plantão DuqueNet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --fundo:#0E1621; --topo:#17212B; --cartao:#1C2733; --cartao2:#22303F;
  --borda:#2A3A4A; --tinta:#F2F6FA; --suave:#8CA2B8;
  --azul:#3E8FD6; --azul-forte:#62BCF9;
  --urgente:#E8524F; --atencao:#E3A13C; --ok:#4CAF7D;
}
:root[data-theme="light"]{
  --fundo:#EEF2F6; --topo:#FFFFFF; --cartao:#FFFFFF; --cartao2:#F5F8FB;
  --borda:#DCE4EC; --tinta:#16202B; --suave:#5E7085;
  --azul:#2B6FA8; --azul-forte:#1F5C8F;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fundo);color:var(--tinta);
  font-family:'Inter',system-ui,sans-serif;line-height:1.45;
  display:flex;flex-direction:column}

header{background:var(--topo);border-bottom:1px solid var(--borda);
  padding:14px 16px 12px;display:flex;align-items:center;gap:12px;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{margin:0;font-size:1.02rem;font-weight:700;letter-spacing:-.01em}
header .hora{margin-left:auto;color:var(--suave);font-size:.78rem;
  font-family:'JetBrains Mono',monospace}
.pontinho{width:8px;height:8px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}

.numeros{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
  background:var(--borda)}
.num{background:var(--topo);padding:11px 8px;text-align:center;cursor:pointer;
  border:none;color:inherit;font-family:inherit;border-top:2px solid transparent}
.num[aria-selected="true"]{background:var(--cartao2);
  border-top-color:var(--azul-forte)}
.num b{display:block;font-size:1.45rem;font-weight:700;line-height:1.1;
  font-variant-numeric:tabular-nums}
.num span{font-size:.7rem;color:var(--suave);letter-spacing:.02em}
.num.alerta b{color:var(--urgente)}

.busca{padding:10px 14px 4px}
.busca input{width:100%;background:var(--cartao);border:1px solid var(--borda);
  color:var(--tinta);border-radius:10px;padding:10px 12px;font-size:.9rem;
  font-family:inherit}
.busca input::placeholder{color:var(--suave)}
.busca input:focus{outline:2px solid var(--azul);outline-offset:1px}

main{flex:1;overflow-y:auto;padding:8px 14px 18px}
.linha{display:flex;align-items:center;gap:11px;width:100%;
  background:var(--cartao);border:1px solid var(--borda);
  border-left:3px solid var(--borda);border-radius:10px;padding:11px 12px;
  margin-bottom:7px;cursor:pointer;color:inherit;font-family:inherit;
  text-align:left}
.linha:hover{background:var(--cartao2)}
.linha.u{border-left-color:var(--urgente)}
.linha.a{border-left-color:var(--atencao)}
.linha.n{border-left-color:var(--ok)}
.linha .ini{width:34px;height:34px;border-radius:9px;flex:0 0 auto;
  background:var(--cartao2);display:flex;align-items:center;
  justify-content:center;font-size:.8rem;font-weight:700;color:var(--suave)}
.linha .meio{flex:1;min-width:0}
.linha .nome{font-weight:600;font-size:.92rem;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.linha .fala{color:var(--suave);font-size:.78rem;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.linha .t{font-family:'JetBrains Mono',monospace;font-size:.82rem;
  font-weight:500;flex:0 0 auto;font-variant-numeric:tabular-nums}
.linha.u .t{color:var(--urgente)}
.linha.a .t{color:var(--atencao)}
.linha.n .t{color:var(--suave)}
.vazio{color:var(--suave);text-align:center;padding:40px 0;font-size:.9rem}

.ficha{position:fixed;inset:0;background:var(--fundo);z-index:20;
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ficha[hidden]{display:none}
.ficha-topo{background:var(--topo);border-bottom:1px solid var(--borda);
  padding:12px 14px;display:flex;align-items:center;gap:10px}
.voltar{background:none;border:none;color:var(--azul-forte);font-size:.9rem;
  font-family:inherit;cursor:pointer;padding:4px 2px;font-weight:600}
.ficha-corpo{flex:1;overflow-y:auto;padding:16px 16px 20px}
.ficha h2{margin:0 0 3px;font-size:1.18rem;font-weight:700}
.chip{display:inline-block;font-size:.72rem;font-weight:600;padding:3px 9px;
  border-radius:999px;margin:6px 6px 0 0}
.chip.u{background:color-mix(in srgb,var(--urgente) 18%,transparent);
  color:var(--urgente)}
.chip.a{background:color-mix(in srgb,var(--atencao) 18%,transparent);
  color:var(--atencao)}
.chip.n{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chip.f{background:var(--cartao2);color:var(--suave)}
.dados{margin:16px 0 0;background:var(--cartao);border:1px solid var(--borda);
  border-radius:12px;overflow:hidden}
.dados div{display:flex;gap:12px;padding:9px 13px;font-size:.86rem;
  border-bottom:1px solid var(--borda)}
.dados div:last-child{border-bottom:none}
.dados span:first-child{color:var(--suave);min-width:82px}
.dados span:last-child{font-weight:500;margin-left:auto;text-align:right}
.balao-cli{margin-top:14px;background:var(--cartao2);
  border-radius:12px 12px 12px 4px;padding:11px 13px;font-size:.88rem}
.balao-cli small{display:block;color:var(--suave);font-size:.72rem;
  margin-bottom:3px}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.acoes a,.acoes button{padding:12px 10px;border-radius:10px;
  border:1px solid var(--borda);background:var(--cartao);color:var(--tinta);
  font-family:inherit;font-size:.86rem;font-weight:600;cursor:pointer;
  display:block;text-align:center;text-decoration:none}
.acoes .primaria{background:var(--azul);border-color:var(--azul);color:#fff;
  grid-column:1/-1}
.acoes a:hover,.acoes button:hover{filter:brightness(1.12)}
.aviso-proto{margin:0 14px calc(14px + env(safe-area-inset-bottom,0px));
  padding:10px 12px;border:1px dashed var(--borda);border-radius:10px;
  color:var(--suave);font-size:.78rem;text-align:center}
/* Um link direto (t.me/bot/plantao) nao traz estado: a pagina cai no
   exemplo, e nomes inventados num painel de plantao sao indistinguiveis
   dos reais a menos que se diga, no alto e sem rolar. */
.tarja-demo{margin:0 0 10px;padding:10px 12px;border-radius:10px;
  background:rgba(245,195,70,.14);border:1px solid rgba(245,195,70,.45);
  color:var(--tinta);font-size:.82rem;line-height:1.45}
.fio{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.fio > div{max-width:88%;padding:9px 12px;border-radius:12px;font-size:.88rem;
  line-height:1.4;white-space:pre-wrap;word-break:break-word}
.fala-cli{align-self:flex-start;background:var(--cartao2);
  border-bottom-left-radius:4px}
.fala-eq{align-self:flex-end;background:var(--azul);color:#fff;
  border-bottom-right-radius:4px}
.fala-robo{align-self:flex-end;background:var(--cartao);
  border:1px solid var(--borda);border-bottom-right-radius:4px}
.fala-robo small{display:block;color:var(--suave);font-size:.7rem;
  margin-bottom:2px}
.caixa{display:flex;gap:8px;margin-top:14px;align-items:stretch}
.caixa textarea{flex:1;min-width:0;resize:none;padding:10px 12px;
  border-radius:10px;border:1px solid var(--borda);background:var(--cartao);
  color:var(--tinta);font:inherit;font-size:.9rem}
.caixa button{padding:0 16px;border-radius:10px;border:none;
  background:var(--azul);color:#fff;font:inherit;font-weight:600}
.caixa .menu-bt{background:var(--cartao2);color:var(--tinta);
  border:1px solid var(--borda);padding:0 12px;font-weight:600}
.folha-fundo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:78%;
  overflow-y:auto;background:var(--topo);border-radius:16px 16px 0 0;
  padding:14px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  box-shadow:0 -8px 24px rgba(0,0,0,.3)}
.folha h3{margin:14px 0 6px;font-size:.72rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--suave);font-weight:600}
.folha h3:first-of-type{margin-top:4px}
.folha .op{display:flex;gap:10px;align-items:baseline;width:100%;
  text-align:left;padding:11px 12px;margin:0 0 6px;border-radius:10px;
  border:1px solid var(--borda);background:var(--cartao);color:var(--tinta);
  font:inherit;font-size:.92rem;cursor:pointer}
.folha .op small{color:var(--suave);font-size:.76rem;margin-left:auto;
  text-align:right}
.folha .op:focus-visible{outline:2px solid var(--azul-forte)}
.folha .fechar{width:100%;margin-top:8px;padding:12px;border-radius:10px;
  border:none;background:var(--cartao2);color:var(--tinta);font:inherit}
</style>
</head>
<body>

<header>
  <span class="pontinho" aria-hidden="true"></span>
  <h1>Plantão DuqueNet</h1>
  <span class="hora" id="hora">--:--</span>
  <button id="atualizar" type="button" title="Atualizar" style="border:none;background:none;color:inherit;font:inherit;cursor:pointer;padding:4px 6px">🔄</button>
</header>

<p class="tarja-demo" id="tarja" hidden>
  Este endereço não traz o plantão. Abra pelo botão <b>Plantão</b>
  da conversa com o bot.
</p>

<div class="numeros" role="tablist">
  <button class="num alerta" role="tab" aria-selected="true" data-fila="esperando">
    <b id="n-esperando">0</b><span>AGUARDANDO</span></button>
  <button class="num" role="tab" aria-selected="false" data-fila="atendimento">
    <b id="n-atendimento">0</b><span>EM ATENDIMENTO</span></button>
  <button class="num" role="tab" aria-selected="false" data-fila="robo">
    <b id="n-robo">0</b><span>COM O ROBÔ</span></button>
</div>

<div class="busca">
  <input id="busca" type="search" placeholder="Buscar por nome ou número…"
         autocomplete="off">
</div>

<main id="lista"></main>

<section class="ficha" id="ficha" hidden>
  <div class="ficha-topo">
    <button class="voltar" id="voltar" type="button">← Voltar</button>
  </div>
  <div class="ficha-corpo" id="ficha-corpo"></div>
</section>

<div class="folha-fundo" id="folha-fundo" hidden></div>
<section class="folha" id="folha" hidden aria-label="Ações"></section>

<p class="aviso-proto" id="rodape">carregando…</p>

<script>
// Plantão ao vivo (23/09). O app não fala com a rede da DuqueNet — nada
// fala. A VM deixa o plantão cifrado num canal privado (DESCE) e lê as
// ações num outro (SOBE); este app faz o mesmo do outro lado. Todo
// mundo só chama api.telegram.org. Senha do bot de entrega e chave AES
// vêm no endereço, que só existe no botão do dono.
const P = new URLSearchParams(location.search);
const CFG = {t: P.get("t"), k: P.get("k"), a: P.get("a"), b: P.get("b"),
             c: P.get("c"), m: P.get("m")};
const AO_VIVO = !!(CFG.t && CFG.k && CFG.a && CFG.b && CFG.m);
const API = "https://api.telegram.org/bot" + CFG.t + "/";
const tg = window.Telegram && window.Telegram.WebApp;
const FILAS = {e: "esperando", a: "atendimento", r: "robo"};
const agora = () => new Date();

// ------------------------------------------------------------ cifra
const b64u = (bytes) => btoa(String.fromCharCode(...bytes))
  .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const deB64u = (s) => {
  const b = s.replace(/-/g, "+").replace(/_/g, "/");
  return Uint8Array.from(atob(b + "=".repeat((4 - b.length % 4) % 4)),
                         (c) => c.charCodeAt(0));
};
let CHAVE = null;
async function chave() {
  if (!CHAVE) CHAVE = await crypto.subtle.importKey(
    "raw", deB64u(CFG.k), "AES-GCM", false, ["encrypt", "decrypt"]);
  return CHAVE;
}
async function decifrar(bytes) {
  const claro = await crypto.subtle.decrypt(
    {name: "AES-GCM", iv: bytes.slice(0, 12)}, await chave(), bytes.slice(12));
  return new Uint8Array(claro);
}
async function cifrar(texto) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const c = new Uint8Array(await crypto.subtle.encrypt(
    {name: "AES-GCM", iv}, await chave(), new TextEncoder().encode(texto)));
  const tudo = new Uint8Array(12 + c.length);
  tudo.set(iv); tudo.set(c, 12);
  return b64u(tudo);
}
async function gunzip(bytes) {
  const fluxo = new Blob([bytes]).stream()
    .pipeThrough(new DecompressionStream("gzip"));
  return new Response(fluxo).text();
}

// ------------------------------------------------------------ Telegram
async function api(metodo, dados) {
  // form-urlencoded: pedido "simples", sem preflight (o Telegram não
  // responde OPTIONS, medido em 23/09).
  const r = await fetch(API + metodo, {method: "POST",
    body: new URLSearchParams(dados)});
  return r.json();
}

// ------------------------------------------------------------ estado
let ESTADO = null, ULTIMO_ARQ = "", FALHAS = 0;
let CONVERSA = null, ULTIMA_CONV = "";   // a conversa da ficha aberta
let DADOS = [];
let filaAtual = "esperando";
let aberto = null;                       // chave da conversa na ficha
let PENDENTES = [];                      // ações ainda sem confirmação

function aplicar(estado) {
  ESTADO = estado;
  const feitos = new Set(estado.feitos || []);
  // Feito não some de imediato: o texto fica como "enviado ✓" até a
  // conversa oficial trazê-lo (dono, 23/09: chegou no WhatsApp antes de
  // aparecer no app). Comando some ao ser feito — a resposta dele vem.
  for (const p of PENDENTES) {
    if (feitos.has(p.id) && !p.feito) p.feito = Date.now();
  }
  PENDENTES = PENDENTES.filter((p) => !(p.feito && p.t.startsWith("/")));
  DADOS = (estado.linhas || []).map((l) => ({
    nome: l.n || "?",
    fila: FILAS[l.f] || "esperando",
    desde: new Date(String(l.t || "").replace(" ", "T")),
    canal: l.c, sigla: l.c === "wa" ? "WPP" : "OPA",
    chave: l.k || "", proto: l.o || "",
    ultima: l.u || "", quem: l.q,
    hist: l.h && estado.ch
      ? "https://t.me/c/" + String(estado.ch).replace(/^-100/, "") + "/" + l.h
      : "",
  }));
}

async function lerFixado(chat) {
  const r = await api("getChat", {chat_id: chat});
  const m = r.ok && r.result.pinned_message;
  if (!m || !m.text) return null;
  return {marca: m.message_id + ":" + (m.edit_date || m.date), texto: m.text};
}
async function abrirTexto(texto) {
  return JSON.parse(await gunzip(await decifrar(deB64u(texto.trim()))));
}

// Texto fixado, e não arquivo: o Telegram não libera o download de
// arquivo para página (sem CORS no /file/, medido 23/09 — era o
// "failed to fetch"). Lista num canal, conversa aberta noutro.
async function buscar() {
  let mudou = false;
  const lista = await lerFixado(CFG.a);
  if (!lista) throw new Error("sem plantão fixado");
  if (lista.marca !== ULTIMO_ARQ) {
    aplicar(await abrirTexto(lista.texto));
    ULTIMO_ARQ = lista.marca;
    mudou = true;
  }
  if (aberto && CFG.c) {
    const conv = await lerFixado(CFG.c);
    if (conv && conv.marca !== ULTIMA_CONV) {
      const c = await abrirTexto(conv.texto);
      ULTIMA_CONV = conv.marca;
      if (c.k === aberto) {
        CONVERSA = c;
        mudou = true;
        const minhas = new Set((c.m || []).filter((m) => m[0] === 1)
                                          .map((m) => m[1]));
        PENDENTES = PENDENTES.filter((p) => !(p.feito
          && (minhas.has(p.t.replace(/\s+/g, " ").trim())
              || Date.now() - p.feito > 30000)));
      }
    }
  }
  return mudou;
}

// Ações: o texto fixado no canal SOBE carrega TODAS as pendentes; a VM
// executa cada id uma vez e devolve os ids feitos no plantão. Se nada
// voltar em 6 s, reescreve (com contador, senão o Telegram diz "não
// modificado").
let ENVIO = 0, ULTIMO_ENVIO = 0;
let OLHANDO = null;
async function empurrar() {
  ENVIO += 1;
  ULTIMO_ENVIO = Date.now();
  const acoes = PENDENTES.filter((p) => !p.feito)
    .map(({id, c, k, t, i}) => ({id, c, k, t, i}));
  const texto = await cifrar(JSON.stringify({n: ENVIO, acoes, olhando: OLHANDO}));
  const r = await api("editMessageText",
                      {chat_id: CFG.b, message_id: CFG.m, text: texto});
  if (!r.ok && !/not modified/i.test(r.description || "")) {
    status("Não consegui enviar: " + (r.description || "erro"), true);
  }
}

// Aberto pelo botão do TECLADO o Telegram não diz quem abriu (initData
// vazio) e a VM recusa toda ação — 23/09. Pelo botão de menu, diz.
const SEM_ASSINATURA = !(tg && tg.initData);

function pedir(d, texto) {
  if (!AO_VIVO) { alert("Exemplo: nada é enviado."); return; }
  if (SEM_ASSINATURA) {
    alert("Este app foi aberto por um botão que não identifica você. "
      + "Feche e abra pelo botão Plantão ao lado do campo de digitar.");
    return;
  }
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  PENDENTES.push({id, c: d.canal, k: d.chave, t: texto,
                  i: (tg && tg.initData) || ""});
  empurrar();
  if (aberto === d.chave) desenharFicha();
}

// ------------------------------------------------------------ tela
const $ = (id) => document.getElementById(id);
const lista = $("lista"), busca = $("busca");
const ficha = $("ficha"), corpo = $("ficha-corpo");

const fmt = (d) => {
  const m = Math.max(0, Math.round((agora() - d) / 60000));
  if (!isFinite(m)) return "—";
  if (m < 60) return m + "min";
  const h = Math.floor(m / 60), r = m % 60;
  if (h < 24) return h + "h" + String(r).padStart(2, "0");
  return Math.floor(h / 24) + "d" + String(h % 24).padStart(2, "0") + "h";
};
const grau = (d) => {
  const m = (agora() - d) / 60000;
  return m >= 60 ? "u" : m >= 15 ? "a" : "n";
};
const iniciais = (n) => n.split(" ").filter(Boolean).slice(0, 2)
  .map((p) => p[0]).join("").toUpperCase();
const textoDe = (html) =>
  new DOMParser().parseFromString(html, "text/html").body.textContent || "";

function status(msg, erro) {
  const el = $("rodape");
  el.textContent = msg;
  el.style.color = erro ? "var(--urgente)" : "";
}

function contar() {
  for (const f of ["esperando", "atendimento", "robo"]) {
    $("n-" + f).textContent = DADOS.filter((d) => d.fila === f).length;
  }
  $("hora").textContent = ESTADO && ESTADO.em
    ? new Date(ESTADO.em * 1000).toTimeString().slice(0, 5) : "--:--";
}

function desenhar() {
  const termo = busca.value.trim().toLowerCase();
  const itens = DADOS
    .filter((d) => d.fila === filaAtual)
    .filter((d) => !termo || d.nome.toLowerCase().includes(termo)
                          || d.chave.includes(termo.replace(/\D/g, "") || "#"))
    .sort((a, b) => a.desde - b.desde);
  lista.innerHTML = "";
  if (!itens.length) {
    lista.innerHTML = '<p class="vazio">Ninguém nesta fila agora.</p>';
    return;
  }
  for (const d of itens) {
    const b = document.createElement("button");
    b.className = "linha " + grau(d.desde);
    b.type = "button";
    b.innerHTML = '<span class="ini"></span><span class="meio">'
      + '<span class="nome"></span><span class="fala"></span></span>'
      + '<span class="t"></span>';
    b.querySelector(".ini").textContent = iniciais(d.nome);
    b.querySelector(".nome").textContent = d.nome;
    b.querySelector(".fala").textContent =
      d.sigla + " · " + (d.ultima || "—");
    b.querySelector(".t").textContent = fmt(d.desde);
    b.addEventListener("click", () => abrirFicha(d));
    lista.appendChild(b);
  }
}

// Tudo que o tópico sabe fazer, sem barra. "pede" = o comando precisa
// de um complemento: ele vai para a caixa de texto e a pessoa completa.
const ACOES = [
  ["Atendimento", [
    ["✅ Encerrar", "/encerrar", "pergunta o motivo"],
    ["🔀 Transferir", "/transferir ", "escreva o motivo", true],
    ["🤖 Passar ao Duque", "/duque", ""],
    ["↩️ Devolver ao robô", "/robo", ""],
    ["🙈 Ignorar número", "/ignorar", "liga/desliga"],
    ["✖ Cancelar assistente", "/cancelar", ""],
  ]],
  ["Financeiro", [
    ["🧾 Boleto", "/boleto", "2ª via"],
    ["💠 PIX", "/pix", "QR e copia e cola"],
    ["📄 Nota fiscal", "/nf", "lista as faturas"],
    ["📊 Extrato", "/financeiro", ""],
    ["🤝 Negociado", "/negociado ", "até quando", true],
    ["💸 Disse que pagou", "/pago", "segura a cobrança"],
  ]],
  ["Técnico", [
    ["📡 Diagnóstico de rede", "/rede", ""],
    ["🛠️ Abrir OS", "/os", "reparo"],
    ["📍 Viabilidade", "/consultar_viabilidade ", "endereço", true],
    ["📝 Cadastro guiado", "/cadastrar_guiado", "pergunta a pergunta"],
    ["📋 Cadastro colado", "/cadastrar ", "cole a ficha", true],
  ]],
];

const folha = $("folha"), folhaFundo = $("folha-fundo");
function fecharMenu() { folha.hidden = true; folhaFundo.hidden = true; }
folhaFundo.addEventListener("click", fecharMenu);

function opcao(rotulo, dica, fazer) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "op";
  b.append(document.createTextNode(rotulo));
  if (dica) {
    const s = document.createElement("small");
    s.textContent = dica;
    b.appendChild(s);
  }
  b.addEventListener("click", () => { fecharMenu(); fazer(); });
  return b;
}

function abrirMenu(d) {
  folha.innerHTML = "";
  const grupos = ACOES.slice();
  const atalhos = CONVERSA && CONVERSA.k === d.chave ? CONVERSA.a || [] : [];
  for (const [titulo, itens] of grupos) {
    const h = document.createElement("h3");
    h.textContent = titulo;
    folha.appendChild(h);
    for (const [rot, cmd, dica, pede] of itens) {
      folha.appendChild(opcao(rot, dica, () => {
        if (pede) { ta.value = cmd; ta.focus(); }
        else pedir(d, cmd);
      }));
    }
  }
  if (atalhos.length) {
    const h = document.createElement("h3");
    h.textContent = "Mensagens prontas";
    folha.appendChild(h);
    for (const [nome, resumo] of atalhos) {
      // O atalho mostra a prévia antes: nada sai sem o "Enviar ao cliente".
      folha.appendChild(opcao("💬 " + nome, resumo, () => pedir(d, "/" + nome)));
    }
  }
  if (d.hist) {
    const h = document.createElement("h3");
    h.textContent = "Outros";
    folha.appendChild(h);
    folha.appendChild(opcao("📜 Histórico completo", "abre o tópico", () => {
      if (tg && tg.openTelegramLink) tg.openTelegramLink(d.hist);
      else window.open(d.hist, "_blank");
    }));
  }
  const fechar = document.createElement("button");
  fechar.type = "button";
  fechar.className = "fechar";
  fechar.textContent = "Fechar";
  fechar.addEventListener("click", fecharMenu);
  folha.appendChild(fechar);
  folhaFundo.hidden = false;
  folha.hidden = false;
}

function abrirFicha(d) {
  aberto = d.chave;
  CONVERSA = null;
  ULTIMA_CONV = "";
  OLHANDO = {c: d.canal, k: d.chave};
  empurrar();
  desenharFicha(true);
}

// A ficha é redesenhada a cada plantão novo SEM perder o que está sendo
// digitado: a caixa de resposta é criada uma vez e só muda de lugar.
const ta = document.createElement("textarea");
ta.id = "resposta";
ta.rows = 2;

function desenharFicha(rolarFim) {
  const d = DADOS.find((x) => x.chave === aberto);
  if (!d) {
    if (aberto) { corpo.innerHTML = '<p class="vazio">Esta conversa saiu do '
      + 'atendimento ativo.</p>'; }
    return;
  }
  const noFim = rolarFim
    || corpo.scrollHeight - corpo.scrollTop - corpo.clientHeight < 80;
  corpo.innerHTML = "";

  const h2 = document.createElement("h2");
  h2.textContent = d.nome;
  corpo.appendChild(h2);
  const chips = document.createElement("div");
  const rotulo = {esperando: "Aguardando", atendimento: "Em atendimento",
                  robo: "Com o robô"}[d.fila];
  for (const [cls, txt] of [[grau(d.desde), fmt(d.desde) + " sem resposta"],
                            ["f", rotulo], ["f", d.sigla],
                            ["f", d.proto]]) {
    if (!txt) continue;
    const c = document.createElement("span");
    c.className = "chip " + cls;
    c.textContent = txt;
    chips.appendChild(c);
  }
  corpo.appendChild(chips);

  const fio = document.createElement("div");
  fio.className = "fio";
  const conv = CONVERSA && CONVERSA.k === d.chave ? CONVERSA : null;
  const falas = conv ? conv.m || [] : [];
  const avisosConv = conv ? conv.v || [] : [];
  if (!conv) {
    const b = document.createElement("p");
    b.className = "vazio";
    b.textContent = "carregando a conversa…";
    fio.appendChild(b);
  }
  for (const [quem, texto, ts] of falas) {
    const b = document.createElement("div");
    b.className = "fala-" + (quem === 0 ? "cli" : quem === 2 ? "robo" : "eq");
    const s = document.createElement("small");
    s.textContent = (quem === 2 ? "🤖 Duque · " : "") + String(ts || "").slice(11, 16);
    b.appendChild(s);
    b.appendChild(document.createTextNode(texto));
    fio.appendChild(b);
  }
  // O que o tópico respondeu (pergunta do motivo, confirmação, erro).
  // Linha "3 - Motivo" vira botão: é o menu, sem digitar número.
  const ult = avisosConv[avisosConv.length - 1];
  for (const [ts, html] of avisosConv) {
    const b = document.createElement("div");
    b.className = "fala-robo";
    const s = document.createElement("small");
    s.textContent = "📌 sistema · " + new Date(ts * 1000).toTimeString().slice(0, 5);
    b.appendChild(s);
    const txt = textoDe(html);
    b.appendChild(document.createTextNode(txt));
    fio.appendChild(b);
    if (ult && ts === ult[0] && /toque enviar/i.test(txt)) {
      const opcoes = document.createElement("div");
      opcoes.className = "acoes";
      for (const [rot, cmd] of [["✅ Enviar ao cliente", "ENVIAR"],
                                ["✖ Cancelar", "CANCELAR"]]) {
        const bt = document.createElement("button");
        bt.type = "button";
        bt.textContent = rot;
        bt.addEventListener("click", () => pedir(d, cmd));
        opcoes.appendChild(bt);
      }
      fio.appendChild(opcoes);
    }
    if (ult && ts === ult[0] && /qual o motivo|responda com o n/i.test(txt)) {
      const opcoes = document.createElement("div");
      opcoes.className = "acoes";
      for (const m of txt.matchAll(/(?:^|\n)\s*(\d{1,2})\s*-\s*([^\n]+)/g)) {
        const bt = document.createElement("button");
        bt.type = "button";
        bt.textContent = m[1] + " · " + m[2].trim();
        bt.addEventListener("click", () => pedir(d, m[1]));
        opcoes.appendChild(bt);
      }
      fio.appendChild(opcoes);
    }
  }
  for (const p of PENDENTES.filter((p) => p.k === d.chave)) {
    const b = document.createElement("div");
    b.className = "fala-eq";
    b.style.opacity = p.feito ? ".85" : ".55";
    const s = document.createElement("small");
    s.textContent = p.feito ? "enviado ✓" : "enviando…";
    b.appendChild(s);
    b.appendChild(document.createTextNode(p.t));
    fio.appendChild(b);
  }
  corpo.appendChild(fio);

  const caixa = document.createElement("div");
  caixa.className = "caixa";
  ta.placeholder = "Responder a " + d.nome.split(" ")[0] + "…";
  const enviar = document.createElement("button");
  enviar.type = "button";
  enviar.textContent = "Enviar";
  enviar.addEventListener("click", () => {
    const t = ta.value.trim();
    if (!t) return;
    ta.value = "";
    pedir(d, t);
  });
  const menuBt = document.createElement("button");
  menuBt.type = "button";
  menuBt.className = "menu-bt";
  menuBt.textContent = "⚡ Ações";
  menuBt.setAttribute("aria-haspopup", "dialog");
  menuBt.addEventListener("click", () => abrirMenu(d));
  caixa.append(menuBt, ta, enviar);
  corpo.appendChild(caixa);

  ficha.hidden = false;
  if (noFim) corpo.scrollTop = corpo.scrollHeight;
}

$("voltar").addEventListener("click", () => {
  fecharMenu();
  ficha.hidden = true;
  aberto = null;
  OLHANDO = null;
});
for (const aba of document.querySelectorAll(".num")) {
  aba.addEventListener("click", () => {
    for (const o of document.querySelectorAll(".num")) {
      o.setAttribute("aria-selected", String(o === aba));
    }
    filaAtual = aba.dataset.fila;
    desenhar();
  });
}
busca.addEventListener("input", desenhar);
$("atualizar").addEventListener("click", () => {
  ULTIMO_ARQ = ""; ULTIMA_CONV = ""; ciclo();
});

// Histórico abre o tópico sem fechar o app (openTelegramLink não fecha
// desde o Bot API 7.0 — core.telegram.org/bots/webapps).
document.addEventListener("click", (ev) => {
  const a = ev.target.closest && ev.target.closest('a[href^="https://t.me/"]');
  if (!a) return;
  ev.preventDefault();
  if (tg && tg.openTelegramLink) tg.openTelegramLink(a.href);
  else window.open(a.href, "_blank");
});

if (tg) {
  tg.ready();
  tg.expand();
  if (tg.colorScheme === "light") {
    document.documentElement.setAttribute("data-theme", "light");
  }
}

// ------------------------------------------------------------ laço
let rodando = false;
async function ciclo() {
  if (rodando) return;
  rodando = true;
  try {
    const mudou = await buscar();
    FALHAS = 0;
    // Sem confirmação em 6 s (ação pendente, ou a conversa aberta que não
    // chegou), escreve de novo.
    if ((PENDENTES.some((p) => !p.feito) || (aberto && !CONVERSA))
        && Date.now() - ULTIMO_ENVIO > 6000) empurrar();
    if (mudou) {
      contar();
      desenhar();
      if (aberto && !ficha.hidden) desenharFicha();
    }
    status("ao vivo · atualizado " + (ESTADO && ESTADO.em
      ? new Date(ESTADO.em * 1000).toLocaleTimeString("pt-BR") : ""));
  } catch (e) {
    FALHAS += 1;
    if (FALHAS > 2) status("sem conexão com o plantão (" + e.message + ")", true);
  } finally {
    rodando = false;
  }
}

if (AO_VIVO && SEM_ASSINATURA) {
  $("tarja").hidden = false;
  $("tarja").textContent = "Aberto por botão antigo: dá para ver, mas não "
    + "para agir. Feche e abra pelo botão Plantão ao lado do campo de digitar.";
}
if (AO_VIVO) {
  status("carregando…");
  ciclo();
  setInterval(ciclo, 1500);
  setInterval(() => { contar(); }, 30000);     // relógio dos "há X min"
} else {
  $("tarja").hidden = false;
  status("Sem conexão: abra pelo botão Plantão da conversa com o bot.", true);
}
</script>
